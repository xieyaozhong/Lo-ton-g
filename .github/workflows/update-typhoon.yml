name: Update typhoon dashboard

on:
  push:
    branches: [main]
    paths:
      - 'tools/update_typhoon_data.py'
      - 'tools/hotfix_typhoon_data.py'
      - 'tools/fetch_official_live.py'
      - 'tools/apply_ncdr.py'
      - 'tools/update_holiday_outlook.py'
      - 'tools/rescore_holiday_outlook.py'
      - '.github/workflows/update-typhoon.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: typhoon-dashboard-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install data dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Refresh slower county weather model when due
        shell: bash
        run: |
          minute=$(date -u +%M)
          if [ ! -f data/typhoon-dashboard.json ] || [ $((10#$minute % 30)) -eq 0 ]; then
            python tools/update_typhoon_data.py
          else
            echo "Keep cached county weather; live sources refresh every 5 minutes."
          fi

      - name: Refresh tomorrow and day-after-tomorrow outlook when due
        shell: bash
        run: |
          due=$(python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/typhoon-dashboard.json')
          try:
              d=json.loads(p.read_text(encoding='utf-8'))
              stamp=(d.get('holiday_outlook') or {}).get('updated_at')
              if not stamp:
                  print('yes')
              else:
                  dt=datetime.fromisoformat(stamp.replace('Z','+00:00')).astimezone(timezone.utc)
                  age=(datetime.now(timezone.utc)-dt).total_seconds()/60
                  print('yes' if age >= 25 else 'no')
          except Exception:
              print('yes')
          PY
          )
          if [ "$due" = "yes" ]; then
            python tools/update_holiday_outlook.py
          else
            echo "Two-day outlook weather is still fresh."
          fi

      - name: Fetch official CWA and NCDR live data
        run: python tools/fetch_official_live.py

      - name: Calibrate live typhoon and route data
        run: python tools/hotfix_typhoon_data.py

      - name: Merge official NCDR closure notices
        run: python tools/apply_ncdr.py

      - name: Re-score two-day outlook against latest CWA track
        run: python tools/rescore_holiday_outlook.py

      - name: Commit data only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/typhoon-dashboard.json data/cwa-live.json data/ncdr-live.json
          if git diff --cached --quiet; then
            echo "No dashboard data change."
            exit 0
          fi
          git commit -m "data: refresh typhoon dashboard"
          git push
