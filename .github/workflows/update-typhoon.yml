name: Update typhoon dashboard

on:
  push:
    branches: [main]
    paths:
      - 'tools/update_typhoon_data.py'
      - 'tools/hotfix_typhoon_data.py'
      - 'tools/probe_cwa_live.py'
      - '.github/workflows/update-typhoon.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: typhoon-dashboard-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install data dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Refresh slower county weather model when due
        shell: bash
        run: |
          minute=$(date -u +%M)
          if [ ! -f data/typhoon-dashboard.json ] || [ $((10#$minute % 30)) -eq 0 ]; then
            python tools/update_typhoon_data.py
          else
            echo "Keep cached county weather; live sources refresh every 5 minutes."
          fi

      - name: Fetch official CWA live cyclone data
        run: python tools/probe_cwa_live.py

      - name: Calibrate live typhoon and closure data
        run: python tools/hotfix_typhoon_data.py

      - name: Commit data only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/typhoon-dashboard.json data/cwa-live.json
          if git diff --cached --quiet; then
            echo "No dashboard data change."
            exit 0
          fi
          git commit -m "data: refresh typhoon dashboard"
          git push
