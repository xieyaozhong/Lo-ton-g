name: Update typhoon dashboard

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: typhoon-dashboard-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install data dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Refresh dashboard data
        run: python tools/update_typhoon_data.py

      - name: Commit data only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/typhoon-dashboard.json
          if git diff --cached --quiet; then
            echo "No dashboard data change."
            exit 0
          fi
          git commit -m "data: refresh typhoon dashboard"
          git push
