name: Update typhoon PWA version

on:
  push:
    branches: [main]
    paths:
      - 'typhoon.html'
      - 'typhoon.webmanifest'
      - 'typhoon-sw.js'
      - 'icons/typhoon-eye.svg'
      - '.github/workflows/update-typhoon-pwa-version.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: typhoon-pwa-version
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write current PWA version
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              'version': os.environ['GITHUB_SHA'],
              'updated_at': datetime.now(timezone.utc).isoformat(timespec='seconds'),
          }
          with open('typhoon-version.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Commit PWA version when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typhoon-version.json
          if git diff --cached --quiet; then
            echo "PWA version unchanged."
            exit 0
          fi
          git commit -m "pwa: publish typhoon app version"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep 2
          done
          exit 1
